name: Build Cloudstream Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine changed directories
        id: changed-dirs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            BASE_COMMIT=origin/${{ github.base_ref }}
          else
            git fetch origin ${{ github.event.before }} --depth=1 || echo "No before commit"
            BASE_COMMIT=${{ github.event.before }}
            if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
              BASE_COMMIT=$(git log -2 --format="%H" | tail -n 1)
            fi
          fi
          echo "Comparing with $BASE_COMMIT"
          CHANGED_DIRS=$(git diff --name-only $BASE_COMMIT ${{ github.sha }} | grep '/' | cut -d'/' -f1 | sort -u | grep -v '^\.' || echo "")
          echo "Changed directories: $CHANGED_DIRS"
          echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT

      - name: Increment version in build.gradle.kts for changed plugins
        run: |
          CHANGED_DIRS="${{ steps.changed-dirs.outputs.dirs }}"
          for dir in $CHANGED_DIRS; do
            BUILD_FILE="$dir/build.gradle.kts"
            if [ -f "$BUILD_FILE" ]; then
              echo "Processing $BUILD_FILE"
              # Extract current version
              CURRENT_VERSION=$(grep -E '^ *version *= *' "$BUILD_FILE" | sed -E "s/.*version *= *['\"]?([0-9]+)['\"]?.*/\1/")
              if [ -n "$CURRENT_VERSION" ]; then
                NEW_VERSION=$((CURRENT_VERSION + 1))
                echo "Updating $dir from version $CURRENT_VERSION to $NEW_VERSION"
                # Replace the version in the file
                sed -i -E "s/^( *version *= *)['\"]?[0-9]+['\"]?(.*)/\1$NEW_VERSION\2/" "$BUILD_FILE"
              else
                 echo "Could not find version in $BUILD_FILE"
              fi
            fi
          done

      - name: Build Plugins
        run: ./gradlew make
        
      - name: Commit version changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-increment plugin version [skip ci]"
          file_pattern: "*/build.gradle.kts"
          skip_dirty_check: false
          
      - name: Generate JSON
        run: |
          mkdir -p output
          echo '[' > output/plugins.json
          FIRST=true
          for dir in AnimeDekhoProvider MyAnimesProvider TooniboyProvider Toonstream Mlsbd MovieBoxProvider Blakite Zephyrflick HianimeqProvider HiAnime; do
            if [ -f "$dir/build.gradle.kts" ]; then
              PLUGIN_JSON="$dir/build/plugin.json"
              if [ -f "$PLUGIN_JSON" ]; then
                if [ "$FIRST" = "false" ]; then
                  echo ',' >> output/plugins.json
                fi
                cat "$PLUGIN_JSON" >> output/plugins.json
                FIRST=false
                cp "$dir/build/"*.cs3 output/ || true
              fi
            fi
          done
          echo ']' >> output/plugins.json
          cat output/plugins.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: plugins
          path: output/*

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: true
